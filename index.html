<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneAfricaForums</title>
  <!-- Redirection immédiate vers l'application -->
  <meta http-equiv="refresh" content="0; url=/app/">
  <link rel="canonical" href="/app/">
  <script>
    // Redirection JS (plus rapide que le meta-refresh sur la plupart des navigateurs)
    window.location.replace('/app/');
  </script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0b1f3a;
      color: #fff;
      text-align: center;
    }
    .loader {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #9cc4ff; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p>Chargement de OneAfricaForums…<br>
  <small>Si rien ne s'affiche, <a href="/app/">cliquez ici</a>.</small></p>
</body>
</html>
